name: Publish to GitHub Pages

# GitHub Pages serves the gh-pages branch; this workflow keeps it an exact
# mirror of main so main stays the single source of truth.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push --force origin HEAD:gh-pages
